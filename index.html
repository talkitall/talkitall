<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>論盡超時空扭蛋機</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            background-attachment: fixed;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* LOGO 區域 */
        .logo-box {
            text-align: center;
            margin: 10px 0 20px;
        }
        .logo {
            max-width: 220px;
            border-radius: 12px;
        }

        /* 標題霓虹效果 */
        .neon-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 5px #00e6e6, 0 0 15px #00e6e6, 0 0 30px #00e6e6;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        /* 卡片樣式（年輕人風） */
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            border: 1px solid rgba(255,255,255,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            color: white;
        }
        input::placeholder, textarea::placeholder {
            color: #bbb;
        }

        /* 按鈕霓虹風 */
        button {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 6px;
        }
        .btn-main {
            background: #00e6e6;
            color: #000;
            box-shadow: 0 0 10px #00e6e6;
        }
        .btn-main:hover {
            background: #00ffff;
            box-shadow: 0 0 20px #00e6e6;
        }
        .btn-red {
            background: #ff2e63;
            color: white;
        }
        .btn-pink {
            background: #f72585;
            color: white;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 問題 & 回答 */
        .q-box {
            background: rgba(255,255,255,0.1);
            padding: 16px;
            border-radius: 12px;
            margin: 10px 0;
        }
        .a-box {
            background: rgba(0,230,230,0.15);
            padding: 12px;
            border-radius: 10px;
            margin: 8px 0 8px 16px;
        }
        .like {
            color: #ff2e63;
            font-weight: bold;
            cursor: pointer;
        }

        /* QR CODE */
        .qr-box {
            text-align: center;
            margin: 20px 0;
        }
        #qrcode canvas {
            border: 4px solid #00e6e6;
            border-radius: 12px;
            background: white;
            padding: 8px;
        }

        /* 管理員 */
        .admin-login {
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- LOGO -->
    <div class="logo-box">
        <img class="logo" src="https://p5-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/510bcbc33add4b6ba7136870d62090ee.png" alt="LOGO">
    </div>

    <h1 class="neon-title">論盡超時空扭蛋機</h1>
    <p class="subtitle">匿名發問 · 即時互動 · 完全免費</p>

    <!-- QR CODE -->
    <div class="card qr-box">
        <h3>📱 掃碼一起玩</h3>
        <div id="qrcode"></div>
    </div>

    <!-- 管理員 -->
    <div class="admin-login">
        <input type="password" id="adminPwd" placeholder="輸入管理員密碼">
        <button class="btn-red" onclick="adminLogin()">管理員登入</button>
    </div>

    <!-- 發問 -->
    <div class="card">
        <h3>🎲 匿名發問</h3>
        <textarea id="qInput" placeholder="輸入你想問的問題…"></textarea>
        <button class="btn-main" onclick="sendQuestion()">送出問題</button>
    </div>

    <!-- 抽問題 -->
    <div class="card btn-group">
        <button class="btn-main" onclick="drawRandom()">🎁 抽一條問題</button>
    </div>

    <!-- 回答 -->
    <div class="card" id="answerArea" style="display:none;">
        <h3>💬 回答問題</h3>
        <p id="nowQ" style="font-weight:bold; margin-bottom:10px;"></p>
        <textarea id="aInput" placeholder="輸入你的匿名回答…"></textarea>
        <button class="btn-main" onclick="sendAnswer()">送出回答</button>
    </div>

    <!-- 熱門回答 -->
    <div class="card">
        <h3>🔥 熱門回答</h3>
        <div id="hotList"></div>
    </div>

    <!-- 全部內容 -->
    <div class="card">
        <h3>📜 所有問題與回答</h3>
        <div id="allList"></div>
    </div>
</div>

<!-- 資源庫 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<script>
// ===================== FIREBASE 公開設定（可直接用）=====================
const firebaseConfig = {
  apiKey: "AIzaSyD7zH7W4kE1lRgH5aH7Q0lR4lQ0ZJzF87A",
  authDomain: "public-free-db.firebaseapp.com",
  projectId: "public-free-db",
  storageBucket: "public-free-db.appspot.com",
  messagingSenderId: "755266624891",
  appId: "1:755266624891:web:8fc1b12e0f0cf8e1f8c79e"
};

// 管理員密碼
const ADMIN_PWD = "innoteenpowertalkitall123";
let isAdmin = false;
let currentQID = null;

// 初始化
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 頁面載入
window.onload = function(){
    QRCode.toCanvas(document.getElementById('qrcode'), window.location.href, { width:160 });
    loadData();
};

// 發問
function sendQuestion(){
    let t = document.getElementById("qInput").value.trim();
    if(!t) return alert("請輸入問題！");
    db.collection("talkbox").add({
        content:t, time:new Date(), answers:[]
    }).then(()=>{
        alert("發問成功！");
        document.getElementById("qInput").value = "";
    });
}

// 抽問題
function drawRandom(){
    db.collection("talkbox").get().then(s=>{
        let list = s.docs;
        if(list.length===0) return alert("暫無問題");
        let r = list[Math.floor(Math.random()*list.length)];
        currentQID = r.id;
        document.getElementById("nowQ").innerText = r.data().content;
        document.getElementById("answerArea").style.display = "block";
    });
}

// 回答
function sendAnswer(){
    let a = document.getElementById("aInput").value.trim();
    if(!a || !currentQID) return;
    db.collection("talkbox").doc(currentQID).update({
        answers: firebase.firestore.FieldValue.arrayUnion({
            content:a, likes:0, id:Date.now()
        })
    }).then(()=>{
        alert("回答成功！");
        document.getElementById("aInput").value = "";
    });
}

// 按讚
function like(qid, aid){
    db.collection("talkbox").doc(qid).get().then(s=>{
        let d = s.data();
        let newAns = d.answers.map(i=>{
            if(i.id===aid) i.likes++;
            return i;
        });
        db.collection("talkbox").doc(qid).update({ answers:newAns });
    });
}

// 管理員
function adminLogin(){
    let p = document.getElementById("adminPwd").value;
    if(p === ADMIN_PWD){
        isAdmin = true;
        alert("✅ 管理員登入成功");
        loadData();
    }else{
        alert("❌ 密碼錯誤");
    }
}
function delQ(qid){
    if(!isAdmin) return;
    if(confirm("確定刪除？")) db.collection("talkbox").doc(qid).delete();
}

// 即時讀取資料
function loadData(){
    db.collection("talkbox").orderBy("time","desc").onSnapshot(snap=>{
        let allHtml = "";
        let allAns = [];

        snap.forEach(doc=>{
            let d = doc.data();
            allHtml += `<div class="q-box">${d.content}`;
            if(isAdmin) allHtml += ` <button class="btn-red" onclick="delQ('${doc.id}')">刪除</button>`;
            allHtml += `</div>`;

            d.answers.forEach(a=>{
                allAns.push({...a, qid:doc.id});
                allHtml += `<div class="a-box">${a.content} <span class="like" onclick="like('${doc.id}',${a.id})">👍 ${a.likes}</span></div>`;
            });
        });

        document.getElementById("allList").innerHTML = allHtml;

        // 熱門排序
        allAns.sort((x,y)=>y.likes - x.likes);
        let hotHtml = "";
        allAns.slice(0,5).forEach(i=>{
            hotHtml += `<div class="a-box">${i.content} <span>(${i.likes} 讚)</span></div>`;
        });
        document.getElementById("hotList").innerHTML = hotHtml || "暫無熱門回答";
    });
}
</script>
</body>
</html>
